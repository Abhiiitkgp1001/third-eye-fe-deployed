name: Sync Org Repo to Personal Repo
on:
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Mirror clone source (org repo)
        env:
          SOURCE_REPO: try-3rd-eye/third-eye-fe
          TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
        run: |
          git clone --mirror \
            "https://x-access-token:${TOKEN}@github.com/${SOURCE_REPO}.git" \
            repo.git

      - name: Push all branches and tags to personal repo
        working-directory: repo.git
        env:
          PERSONAL_REPO: Abhiiitkgp1001/third-eye-fe-deployed
          TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
        run: |
          git remote add personal \
            "https://x-access-token:${TOKEN}@github.com/${PERSONAL_REPO}.git"
          git push personal --force --prune \
            "refs/heads/*:refs/heads/*" \
            "refs/tags/*:refs/tags/*"
